<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karta pracy – Koty</title>
  <style>
    :root{
      --bg:#f6f8fb;
      --card:#ffffff;
      --ink:#1f2937;
      --muted:#5b6472;
      --accent:#2b7de9;
      --accent2:#eaf3ff;
      --border:#d7dee8;
      --shadow:0 10px 30px rgba(0,0,0,.08);
    }
    html,body{height:100%;}
    body{ margin:0; font-family:Arial, Helvetica, sans-serif; color:var(--ink); background:linear-gradient(180deg,#eef4ff 0%, var(--bg) 100%);}    .wrap{ max-width:1400px; margin:0 auto; padding:24px; box-sizing:border-box; }
    .header{ background:var(--card); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:24px 28px; display:flex; justify-content:space-between; align-items:center; gap:20px; margin-bottom:22px; flex-wrap:wrap; }
    .title h1{ margin:0 0 8px 0; font-size:40px; line-height:1.05; }
    .title p{ margin:0; font-size:20px; color:var(--muted); }
    .controls{ display:flex; gap:12px; flex-wrap:wrap; }
    button{ border:0; background:var(--accent); color:#fff; font-size:18px; padding:14px 20px; border-radius:14px; cursor:pointer; font-weight:700; box-shadow:0 6px 14px rgba(43,125,233,.25); }
    button.secondary{ background:#fff; color:var(--accent); border:2px solid var(--accent); box-shadow:none; }
    .grid{ display:grid; grid-template-columns:1.25fr .75fr; gap:22px; }
    .panel{ background:var(--card); border:1px solid var(--border); border-radius:22px; box-shadow:var(--shadow); padding:24px 28px; }
    .panel h2{ margin:0 0 16px 0; font-size:28px; }
    .task{ margin-bottom:22px; padding-bottom:18px; border-bottom:1px dashed var(--border); }
    .task:last-child{border-bottom:0; margin-bottom:0; padding-bottom:0;}
    .task-title{ font-size:23px; font-weight:700; margin:0 0 10px 0; }
    .task-text{ font-size:22px; line-height:1.55; margin:0; }
    .answer-line{ display:block; height:28px; border-bottom:3px solid #c8d3e0; margin-top:10px; }
    .choices{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
    .choice{ border:2px solid var(--border); border-radius:999px; padding:10px 16px; font-size:20px; background:#fff; }
    .sidebox{ display:grid; gap:18px; }
    .info{ background:linear-gradient(180deg,#fff 0%, #f8fbff 100%); border:1px solid var(--border); border-radius:22px; padding:20px; box-shadow:var(--shadow); }
    .info h3{ margin:0 0 10px 0; font-size:24px; }
    .info ul{ margin:0; padding-left:22px; font-size:20px; line-height:1.6; }
    .cat-emoji{ font-size:64px; text-align:center; margin-top:8px; }
    .name{ display:inline-block; min-width:240px; border-bottom:3px solid #c8d3e0; vertical-align:middle; height:1.1em; }
    @media (max-width: 1100px){ .grid{grid-template-columns:1fr;} .title h1{font-size:34px;} .title p{font-size:18px;} }
    @media print{ body{background:#fff;} .wrap{max-width:none; padding:0;} .header, .panel, .info{box-shadow:none;} .controls{display:none;} .grid{grid-template-columns:1fr .75fr;} }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Karta pracy – Koty</h1>
        <p>Losowe zadania odświeżane przy każdym wejściu na stronę</p>
      </div>
      <div class="controls">
        <button id="newBtn">Nowe zadania</button>
        <button class="secondary" onclick="window.print()">Drukuj / PDF</button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Twoje zadania</h2>
        <div id="content"></div>
      </div>

      <div class="sidebox">
        <div class="info">
          <h3>Dane ucznia</h3>
          <p style="font-size:20px; line-height:1.7; margin:0;">Imię i nazwisko: <span class="name"></span><br><br>Data: <span class="name" style="min-width:180px;"></span></p>
        </div>
        <div class="info">
          <h3>Wskazówka</h3>
          <ul>
            <li>Czytaj uważnie polecenia.</li>
            <li>Odpowiadaj pełnym zdaniem.</li>
            <li>Zadania zmieniają się po odświeżeniu strony.</li>
          </ul>
          <div class="cat-emoji">🐱</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const names = ["Mruś", "Filemon", "Puszek", "Kicia", "Luna", "Burek", "Mruczek", "Gacek"];
    const adjectives = ["mały", "puszysty", "ciekawski", "zwinny", "leniwy", "wesoły", "sprytny", "młody"];
    const places = ["na kanapie", "na parapecie", "w ogrodzie", "pod stołem", "przy oknie", "w koszu", "na dywanie"];
    const foods = ["mleko", "tuńczyk", "rybę", "karmę", "śmietankę", "wodę"];
    const actions = ["mruczy", "miauczy", "biega", "skacze", "śpi", "obserwuje", "bawi się"];
    const animals = ["wróbla", "myszkę", "ptaka", "motyla", "muchę"];
    const bodyParts = ["łapki", "wąsy", "uszy", "ogon", "pyszczek"];
    const pick = arr => arr[Math.floor(Math.random()*arr.length)];
    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
    const taskCard = (title, html) => `<div class="task"><div class="task-title">${title}</div>${html}</div>`;

    function generate(){
      const catName = pick(names), catAdj = pick(adjectives), catPlace = pick(places), catFood = pick(foods), catAction = pick(actions), catAnimal = pick(animals), catPart = pick(bodyParts);
      const q1 = `<p class="task-text">Przeczytaj zdanie i odpowiedz: <strong>${catName}</strong> jest <strong>${catAdj}</strong> kotem, który często siedzi <strong>${catPlace}</strong>.</p><p class="task-text">Jakiego jest rodzaju kot? Napisz 1 lub 2 cechy.</p><span class="answer-line"></span>`;
      const q2Choices = shuffle([catFood, "zupa", "chleb", "mleko", "ryba", "sałata"]);
      const q2 = `<p class="task-text">Wybierz i podkreśl właściwy wyraz: Kot lubi jeść <strong>${pick(q2Choices)}</strong>.</p><div class="choices">${q2Choices.map(c => `<span class="choice">${c}</span>`).join('')}</div>`;
      const q3 = `<p class="task-text">Uzupełnij zdanie:</p><p class="task-text"><strong>Kot ma cztery _____________ i długi _____________. </strong></p><span class="answer-line"></span>`;
      const q4 = shuffle([`${catName} ${catAction} po pokoju.`, `Kot widzi ${catAnimal} w ogrodzie.`, `Kotek ma miękkie ${catPart}.`, `Na dywanie leży piłka.`]);
      const q4Html = q4.map((s, i) => `<p class="task-text">${i+1}. ${s}</p>`).join('');
      const wordSet = shuffle(["kot", "mleko", "wąsy", "łapka", "miska", "ogon", "mruczeć", "kocia"]);
      const q5 = `<p class="task-text">Wypisz 3 wyrazy związane z kotem:</p><p class="task-text">${wordSet.slice(0,4).join(' &nbsp;&nbsp; ')}</p><span class="answer-line"></span><span class="answer-line"></span><span class="answer-line"></span>`;
      const scramble1 = shuffle(["Kotek", "lubi", "spać", "na", "miękkiej", "kanapie"]);
      const scramble2 = shuffle(["Kot", "goni", "małą", "myszkę"]);
      const q6 = `<p class="task-text">Ułóż wyrazy w poprawnej kolejności:</p><p class="task-text"><strong>${scramble1.join(' / ')}</strong></p><span class="answer-line"></span><p class="task-text"><strong>${scramble2.join(' / ')}</strong></p><span class="answer-line"></span>`;
      document.getElementById('content').innerHTML = [taskCard("1. Czytanie ze zrozumieniem", q1), taskCard("2. Wybór poprawnego wyrazu", q2), taskCard("3. Uzupełnij zdanie", q3), taskCard("4. Porządkowanie informacji", q4Html), taskCard("5. Słowa o kotach", q5), taskCard("6. Układanie zdań", q6)].join('');
    }
    document.getElementById('newBtn').addEventListener('click', generate);
    generate();
  </script>
</body>
</html>
