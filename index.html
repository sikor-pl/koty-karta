<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Karta pracy – Koty</title>
  <style>
    :root{
      --bg:#eef4ff;
      --bg2:#fff4e8;
      --card:#ffffff;
      --ink:#172033;
      --muted:#5f6b7d;
      --accent:#6b5cff;
      --accent2:#ff7a59;
      --accent3:#13b8a6;
      --accent4:#ffd43b;
      --border:#dbe4f0;
      --shadow:0 18px 46px rgba(31,41,55,.14);
      --radius:28px;
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      color:var(--ink);
      background:
        radial-gradient(circle at top left, rgba(107,92,255,.18), transparent 30%),
        radial-gradient(circle at top right, rgba(255,122,89,.18), transparent 26%),
        linear-gradient(180deg, var(--bg) 0%, #f9fbff 45%, var(--bg2) 100%);
    }
    .wrap{ max-width:none; min-height:100%; margin:0 auto; padding:24px; }
    .header{
      background:linear-gradient(135deg, rgba(255,255,255,.98), rgba(248,251,255,.96));
      border:1px solid rgba(255,255,255,.7);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      padding:28px 30px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:20px;
      overflow:hidden;
      position:relative;
    }
    .header::before{
      content:"";
      position:absolute;
      inset:-50px auto auto -50px;
      width:220px;
      height:220px;
      border-radius:50%;
      background:radial-gradient(circle, rgba(255,212,59,.35), transparent 60%);
      pointer-events:none;
    }
    .title h1{ margin:0 0 10px 0; font-size:46px; line-height:1.03; }
    .title p{ margin:0; font-size:22px; color:var(--muted); }
    .controls{ display:flex; gap:14px; flex-wrap:wrap; }
    button{
      border:0;
      background:linear-gradient(135deg, var(--accent), #8b7dff);
      color:#fff;
      font-size:22px;
      padding:18px 26px;
      border-radius:20px;
      cursor:pointer;
      font-weight:800;
      min-height:62px;
      box-shadow:0 12px 24px rgba(107,92,255,.28);
      transition:transform .15s ease, box-shadow .15s ease, filter .15s ease;
      touch-action:manipulation;
    }
    button:hover{ transform:translateY(-2px); filter:saturate(1.08); }
    button:active{ transform:translateY(1px) scale(.99); }
    button.secondary{
      background:#fff;
      color:var(--accent);
      border:3px solid rgba(107,92,255,.25);
      box-shadow:none;
    }
    .grid{ display:grid; grid-template-columns:1.15fr .85fr; gap:22px; margin-top:22px; }
    .panel, .info{
      background:linear-gradient(180deg, rgba(255,255,255,.98), rgba(248,251,255,.98));
      border:1px solid var(--border);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .panel{ padding:28px 30px; }
    .panel h2{
      margin:0 0 18px 0;
      font-size:32px;
      display:flex;
      gap:12px;
      align-items:center;
    }
    .panel h2::before{ content:"✨"; }
    .statusbar{
      display:flex;
      align-items:center;
      gap:14px;
      margin:0 0 18px 0;
      padding:16px 18px;
      border-radius:18px;
      background:linear-gradient(135deg, rgba(19,184,166,.12), rgba(255,212,59,.16));
      border:1px solid rgba(19,184,166,.18);
      font-size:19px;
      font-weight:800;
    }
    .progress{ flex:1; height:16px; border-radius:999px; background:#dfe8f6; overflow:hidden; }
    .progress > span{
      display:block;
      width:100%;
      height:100%;
      background:linear-gradient(90deg, var(--accent3), var(--accent), var(--accent2));
    }
    .task{
      margin-bottom:18px;
      padding:22px;
      border:1px solid #e6edf7;
      border-radius:24px;
      background:linear-gradient(180deg,#fff 0%, #fcfdff 100%);
      box-shadow:0 10px 22px rgba(31,41,55,.06);
      animation:pop .28s ease;
    }
    @keyframes pop{
      from{ transform:scale(.985); opacity:.65; }
      to{ transform:scale(1); opacity:1; }
    }
    .task-title{
      font-size:28px;
      font-weight:900;
      margin:0 0 14px 0;
      display:flex;
      align-items:center;
      gap:12px;
    }
    .task-title::before{ content:"🐾"; font-size:24px; }
    .task-text{ font-size:28px; line-height:1.55; margin:0; }
    .answer-line{ display:block; height:34px; border-bottom:4px solid #c8d3e0; margin-top:12px; }
    .choices{ display:flex; flex-wrap:wrap; gap:12px; margin-top:14px; }
    .choice{
      border:2px solid #d8e1f0;
      border-radius:999px;
      padding:16px 22px;
      font-size:24px;
      background:#fff;
      min-height:62px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      user-select:none;
      transition:transform .15s ease, background .15s ease, border-color .15s ease, box-shadow .15s ease;
      touch-action:manipulation;
    }
    .choice:hover,
    .choice.selected{
      background:linear-gradient(135deg, #f2eeff, #fff2e9);
      border-color:#8b7dff;
      box-shadow:0 10px 18px rgba(107,92,255,.14);
      transform:translateY(-1px);
    }
    .sidebox{ display:grid; gap:18px; }
    .info{ padding:24px; }
    .info h3{
      margin:0 0 12px 0;
      font-size:28px;
      display:flex;
      align-items:center;
      gap:10px;
    }
    .info h3::before{ content:"🌈"; }
    .info ul{ margin:0; padding-left:24px; font-size:22px; line-height:1.7; }
    .cat-emoji{ font-size:84px; text-align:center; margin-top:16px; }
    .name{
      display:inline-block;
      min-width:280px;
      border-bottom:4px solid #c8d3e0;
      vertical-align:middle;
      height:1.1em;
    }
    @media (max-width: 1100px){
      .grid{grid-template-columns:1fr;}
      .title h1{font-size:38px;}
      .title p{font-size:19px;}
      .task-text{font-size:24px;}
    }
    @media print{
      body{background:#fff;}
      .wrap{max-width:none; padding:0;}
      .header, .panel, .info{box-shadow:none;}
      .controls{display:none;}
      .grid{grid-template-columns:1fr .75fr;}
      .statusbar{display:none;}
      .choice:hover, .choice.selected{box-shadow:none; transform:none;}
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">
        <h1>Karta pracy – Koty</h1>
        <p>Tryb tablicy multimedialnej: duże kafle, dotykowe wybory i pełnoekranowy wygląd</p>
      </div>
      <div class="controls">
        <button id="newBtn">Nowe zadania 🐱</button>
        <button class="secondary" onclick="window.print()">Drukuj / PDF</button>
      </div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Twoje zadania</h2>
        <div class="statusbar">
          <span>Postęp</span>
          <div class="progress"><span id="progressFill"></span></div>
          <span id="progressText">6 / 6</span>
        </div>
        <div id="content"></div>
      </div>

      <div class="sidebox">
        <div class="info">
          <h3>Dane ucznia</h3>
          <p style="font-size:22px; line-height:1.7; margin:0;">Imię i nazwisko: <span class="name"></span><br><br>Data: <span class="name" style="min-width:180px;"></span></p>
        </div>
        <div class="info">
          <h3>Wskazówka</h3>
          <ul>
            <li>Czytaj uważnie polecenia.</li>
            <li>Dotykaj kafelków, aby je zaznaczać.</li>
            <li>Nowy zestaw pojawia się po kliknięciu.</li>
          </ul>
          <div class="cat-emoji">🐱</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const names = ["Mruś", "Filemon", "Puszek", "Kicia", "Luna", "Burek", "Mruczek", "Gacek"];
    const adjectives = ["mały", "puszysty", "ciekawski", "zwinny", "leniwy", "wesoły", "sprytny", "młody"];
    const places = ["na kanapie", "na parapecie", "w ogrodzie", "pod stołem", "przy oknie", "w koszu", "na dywanie"];
    const foods = ["mleko", "tuńczyk", "rybę", "karmę", "śmietankę", "wodę"];
    const actions = ["mruczy", "miauczy", "biega", "skacze", "śpi", "obserwuje", "bawi się"];
    const animals = ["wróbla", "myszkę", "ptaka", "motyla", "muchę"];
    const bodyParts = ["łapki", "wąsy", "uszy", "ogon", "pyszczek"];
    const totalTasks = 6;
    const pick = arr => arr[Math.floor(Math.random()*arr.length)];
    const shuffle = arr => [...arr].sort(() => Math.random() - 0.5);
    const taskCard = (title, html) => `<div class="task"><div class="task-title">${title}</div>${html}</div>`;

    function generate(){
      const catName = pick(names), catAdj = pick(adjectives), catPlace = pick(places), catFood = pick(foods), catAction = pick(actions), catAnimal = pick(animals), catPart = pick(bodyParts);
      const q1 = `<p class="task-text">Przeczytaj zdanie i odpowiedz: <strong>${catName}</strong> jest <strong>${catAdj}</strong> kotem, który często siedzi <strong>${catPlace}</strong>.</p><span class="answer-line"></span><p class="task-text">Napisz pełne zdanie.</p><span class="answer-line"></span>`;
      const q2Choices = shuffle([catFood, "zupa", "chleb", "mleko", "ryba", "sałata"]);
      const q2 = `<p class="task-text">Wybierz i dotknij właściwy wyraz: Kot lubi jeść <strong>${pick(q2Choices)}</strong>.</p><div class="choices">${q2Choices.map(c => `<span class="choice" onclick="this.classList.toggle('selected')">${c}</span>`).join('')}</div>`;
      const q3 = `<p class="task-text">Uzupełnij zdanie:</p><p class="task-text"><strong>Kot ma cztery _____________ i długi _____________. </strong></p><span class="answer-line"></span>`;
      const q4 = shuffle([`${catName} ${catAction} po pokoju.`, `Kot widzi ${catAnimal} w ogrodzie.`, `Kotek ma miękkie ${catPart}.`, `Na dywanie leży piłka.`]);
      const q4Html = `<div class="choices">${q4.map((s, i) => `<span class="choice" onclick="this.classList.toggle('selected')">${i+1}. ${s}</span>`).join('')}</div>`;
      const wordSet = shuffle(["kot", "mleko", "wąsy", "łapka", "miska", "ogon", "mruczeć", "kocia"]);
      const q5 = `<p class="task-text">Wypisz 3 wyrazy związane z kotem:</p><div class="choices">${wordSet.slice(0,4).map(w => `<span class="choice" onclick="this.classList.toggle('selected')">${w}</span>`).join('')}</div><span class="answer-line"></span><span class="answer-line"></span>`;
      const scramble1 = shuffle(["Kotek", "lubi", "spać", "na", "miękkiej", "kanapie"]);
      const scramble2 = shuffle(["Kot", "goni", "małą", "myszkę"]);
      const q6 = `<p class="task-text">Ułóż wyrazy w poprawnej kolejności:</p><div class="choices">${scramble1.map(w => `<span class="choice" onclick="this.classList.toggle('selected')">${w}</span>`).join('')}</div><span class="answer-line"></span><div class="choices">${scramble2.map(w => `<span class="choice" onclick="this.classList.toggle('selected')">${w}</span>`).join('')}</div><span class="answer-line"></span>`;
      document.getElementById('content').innerHTML = [
        taskCard("1. Czytanie ze zrozumieniem", q1),
        taskCard("2. Wybór poprawnego wyrazu", q2),
        taskCard("3. Uzupełnij zdanie", q3),
        taskCard("4. Co pasuje do zdania?", q4Html),
        taskCard("5. Słowa o kotach", q5),
        taskCard("6. Układanie zdań", q6)
      ].join('');
      document.getElementById('progressFill').style.width = '100%';
      document.getElementById('progressText').textContent = `${totalTasks} / ${totalTasks}`;
    }
    document.getElementById('newBtn').addEventListener('click', generate);
    generate();
  </script>
</body>
</html>
